<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>WEB 55 PANEL</title>

<style>
* { box-sizing: border-box; }

body{
  margin:0;
  background:#0b0c10;
  color:#e0e6ed;
  font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  height:100vh;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

/* ======== STAT BAR (RESPONSIVE GRID) ======== */
.stat-bar{
  display:grid;
  grid-template-columns: repeat(4, 1fr);
  gap:4px;
  padding:5px 6px;
  background:#12141c;
  border-bottom:1px solid #1f2433;
  flex-shrink:0;
}

.stat-card{
  background:#1a1d29;
  border:1px solid #282f42;
  border-radius:6px;
  padding:4px 6px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
}

.stat-card .label{
  color:#8a94a6;
  font-size:9px;
  text-transform:uppercase;
  letter-spacing:0.3px;
  margin-bottom:1px;
}

.stat-card .value{
  font-weight:bold;
  font-size:12px;
}

.stat-card.win-rate .value { color:#00e676; }
.stat-card.streak-win .value { color:#ffeb3b; }
.stat-card.streak-lose .value { color:#ff5252; }
.stat-card.total .value { color:#80d8ff; }
.stat-card.pola .value { color:#ce93d8; font-size:11px; }
.stat-card.conf .value { color:#ffd54f; }

.stat-card.signal {
  grid-column: span 2;
  font-weight:bold;
}
.stat-card.signal.strong { border-color:#00e676; background:#0b2918; color:#00e676; }
.stat-card.signal.medium { border-color:#ffb300; background:#291e05; color:#ffb300; }
.stat-card.signal.wait { border-color:#ff5252; background:#290d0d; color:#ff8a80; }

.stat-card.suggest {
  grid-column: span 2;
}
.stat-card.suggest.besar { border-color:#2979ff; background:#0d1f42; color:#82b1ff; }
.stat-card.suggest.kecil { border-color:#ff1744; background:#380e15; color:#ff8a80; }

/* ======== TREND DOTS ======== */
.trend-bar{
  padding:3px 8px;
  background:#0e1017;
  display:flex;
  align-items:center;
  gap:4px;
  overflow-x:auto;
  border-bottom:1px solid #1a1e2b;
  min-height:24px;
  flex-shrink:0;
}

.trend-bar .tlabel{
  font-size:10px;
  color:#5a6578;
  margin-right:2px;
  flex-shrink:0;
  font-weight:700;
}

.dot{
  width:12px;
  height:12px;
  border-radius:50%;
  flex-shrink:0;
}
.dot.besar{ background:#2979ff; box-shadow:0 0 4px rgba(41,121,255,0.7); }
.dot.kecil{ background:#ff1744; box-shadow:0 0 4px rgba(255,23,68,0.7); }
.dot.pending{ background:#2e3547; animation:pulse 1.2s infinite; }

@keyframes pulse {
  0%, 100% { opacity: 0.4; }
  50% { opacity: 1; }
}

/* ======== PANEL TABEL ======== */
.panel{
  flex:0 0 auto;
  height:28vh;
  min-height:160px;
  max-height:35vh;
  background:#12141c;
  overflow-y:auto;
  padding:0;
  -webkit-overflow-scrolling:touch;
}

.web55{
  flex:1 1 auto;
  min-height:0;
  height:100%;
}

iframe{
  width:100%;
  height:100%;
  border:none;
}

table{
  width:100%;
  border-collapse:collapse;
  font-size:11px;
}

th,td{
  border:1px solid #1f2433;
  padding:4px 3px;
  text-align:center;
}

th{
  background:#171a24;
  color:#8a94a6;
  font-size:10px;
  position:sticky;
  top:0;
  z-index:2;
  letter-spacing:0.3px;
}

tr:hover td { background:#181c28; }

.win{ color:#00e676; font-weight:bold; }
.lose{ color:#ff5252; font-weight:bold; }
td.pred-besar { color:#82b1ff; font-weight:bold; }
td.pred-kecil { color:#ff8a80; font-weight:bold; }

.badge-conf{
  font-size:9px;
  padding:1px 4px;
  border-radius:3px;
  background:#1e2433;
}
.badge-conf.high{ color:#00e676; }
.badge-conf.med{ color:#ffb300; }
.badge-conf.low{ color:#8a94a6; }

.loading-cell{
  padding:16px;
  color:#8a94a6;
  font-size:12px;
}
</style>
</head>

<body>

<!-- STAT BAR -->
<div class="stat-bar">
  <div class="stat-card win-rate">
    <span class="label">📊 Win Rate</span>
    <span class="value" id="sWinRate">-</span>
  </div>
  <div class="stat-card total">
    <span class="label">🎯 W/L</span>
    <span class="value" id="sTotal">0W/0L</span>
  </div>
  <div class="stat-card" id="sStreakCard">
    <span class="label">🔥 Streak</span>
    <span class="value" id="sStreak">-</span>
  </div>
  <div class="stat-card conf">
    <span class="label">🎯 Conf</span>
    <span class="value" id="sConf">-</span>
  </div>

  <div class="stat-card pola" style="grid-column:span 2;">
    <span class="label">📈 Pola Tren</span>
    <span class="value" id="sPola">Menganalisis...</span>
  </div>
  <div class="stat-card signal strong" id="sSignalCard">
    <span class="label">⚡ Sinyal</span>
    <span class="value" id="sSignal">-</span>
  </div>
  <div class="stat-card suggest" id="sSuggestCard" style="grid-column:span 2;">
    <span class="label">🤖 Saran Prediksi</span>
    <span class="value" id="sSuggest">-</span>
  </div>
</div>

<!-- TREND DOTS -->
<div class="trend-bar" id="trendBar">
  <span class="tlabel">TREN:</span>
</div>

<!-- TABLE PANEL -->
<div class="panel">
  <table>
    <thead>
      <tr>
        <th style="width:20%;">Periode</th>
        <th style="width:18%;">Prediksi</th>
        <th style="width:14%;">Conf</th>
        <th style="width:12%;">Sisa</th>
        <th style="width:22%;">Hasil</th>
        <th style="width:14%;">Status</th>
      </tr>
    </thead>
    <tbody id="dataBody">
      <tr id="loadingRow">
        <td colspan="6" class="loading-cell">⏳ Menghubungkan ke live data 55five...</td>
      </tr>
    </tbody>
  </table>
</div>

<div class="web55">
  <iframe src="https://55x4mqd.com/#/home/"></iframe>
</div>

<script>

let currentRow = null;
let timer = null;
let lastPeriode = null;
let lastSisa = null;

// Riwayat resmi: [{ issue: "52864", kategori: "Besar", angka: 9 }]
let hasilHistory = [];
let totalWin = 0;
let totalLose = 0;

function kategori(num){
  return num <= 4 ? "Kecil" : "Besar";
}

// ======== SISTEM KONSENSUS MULTI-INDIKATOR (AI ENSEMBLE) ========
function analisisPrediksi(){
  if(hasilHistory.length < 3){
    return {
      tebakan: "Besar",
      pola: "Memuat Data...",
      confidence: 50,
      signal: "WAIT",
      signalText: "MENGANALISIS..."
    };
  }

  const cats = hasilHistory.map(h => h.kategori);
  const nums = hasilHistory.map(h => h.angka);

  // 1. ENGINE NAGA SEJATI (Streak >= 3)
  // Pantang potong naga yang sudah matang (>= 3 kali beruntun)!
  let streak = 1;
  for(let i = 1; i < cats.length; i++){
    if(cats[i] === cats[0]) streak++;
    else break;
  }

  if(streak >= 3){
    return {
      tebakan: cats[0],
      pola: "🔥 Naga " + cats[0] + " (" + streak + "x)",
      confidence: Math.min(76 + streak * 4, 94),
      signal: "STRONG",
      signalText: "IKUTI NAGA (" + streak + "x)"
    };
  }

  // 2. ENGINE PING-PONG FLEKSIBEL (Selang-Seling Aktif >= 3)
  // Hitung berapa kali pergantian selang-seling terjadi di deret terdepan
  let altCount = 1;
  for(let i = 1; i < cats.length; i++){
    if(cats[i] !== cats[i-1]) altCount++;
    else break;
  }

  if(altCount >= 3){
    const nextAlt = cats[0] === "Besar" ? "Kecil" : "Besar";
    return {
      tebakan: nextAlt,
      pola: "⚡ Ping-Pong (" + altCount + "x)",
      confidence: Math.min(76 + altCount * 3, 90),
      signal: "STRONG",
      signalText: "IKUTI PING-PONG (" + altCount + "x)"
    };
  }

  // 3. ENSEMBLE KONSENSUS MULTI-INDIKATOR (Untuk Pasar Transisi / Non-Naga)
  let scoreBesar = 0;
  let scoreKecil = 0;

  // Indikator A: Weighted Moving Average (WMA 4 Angka Terakhir)
  const w = [4, 3, 2, 1];
  let wSum = 0, wTotal = 0;
  for(let i = 0; i < Math.min(nums.length, 4); i++){
    wSum += nums[i] * w[i];
    wTotal += w[i];
  }
  const wma = wSum / wTotal;
  if(wma >= 5.5) scoreBesar += 3.0;
  else if(wma >= 4.7) scoreBesar += 1.5;
  else if(wma <= 3.5) scoreKecil += 3.0;
  else if(wma <= 4.3) scoreKecil += 1.5;

  // Indikator B: Dominansi Rolling 7 Periode
  const slice7 = cats.slice(0, 7);
  const b7 = slice7.filter(c => c === "Besar").length;
  const k7 = slice7.length - b7;
  if(b7 >= 5) scoreBesar += 2.5;
  else if(k7 >= 5) scoreKecil += 2.5;
  else if(b7 > k7) scoreBesar += 1.0;
  else if(k7 > b7) scoreKecil += 1.0;

  // Indikator C: Gravitasi Nilai Ekstrem
  // Jika angka terakhir 9 (maksimum), tekanan koreksi ke bawah tinggi
  // Jika angka terakhir 0 (minimum), tekanan koreksi ke atas tinggi
  if(nums[0] === 9) scoreKecil += 1.5;
  else if(nums[0] === 0) scoreBesar += 1.5;
  else if(nums[0] >= 7) scoreBesar += 0.8;
  else if(nums[0] <= 2) scoreKecil += 0.8;

  // Indikator D: Dinamika Pasangan Kembar 2x
  if(streak === 2){
    // Pada pair 2x, sering terjadi pembalikan (cut) kecuali didukung WMA kuat
    if(cats[0] === "Besar" && wma < 5.0) scoreKecil += 1.8;
    else if(cats[0] === "Kecil" && wma > 4.0) scoreBesar += 1.8;
    else {
      if(cats[0] === "Besar") scoreBesar += 1.2;
      else scoreKecil += 1.2;
    }
  }

  // HITUNG KONSENSUS
  const totalScore = scoreBesar + scoreKecil;
  const isBesar = scoreBesar >= scoreKecil;
  const winningScore = Math.max(scoreBesar, scoreKecil);
  const ratio = totalScore > 0 ? winningScore / totalScore : 0.5;
  const conf = Math.min(Math.round(52 + ratio * 36), 88);

  // Filter Keamanan Pasar Acak (Anti-Whipsaw)
  let signal = "NORMAL";
  let signalText = "NORMAL (" + (isBesar ? "BESAR" : "KECIL") + ")";
  let pola = "Konsensus " + (isBesar ? "Besar" : "Kecil");

  if(conf >= 74){
    signal = "STRONG";
    signalText = "🔥 SINYAL KUAT (" + (isBesar ? "BESAR" : "KECIL") + ")";
    pola = "Tren Dominan " + (isBesar ? "Besar" : "Kecil");
  } else if(conf < 63){
    signal = "WAIT";
    signalText = "⚠️ SARAN: SKIP / WAIT";
    pola = "Pasar Acak (50/50)";
  }

  return {
    tebakan: isBesar ? "Besar" : "Kecil",
    pola: pola,
    confidence: conf,
    signal: signal,
    signalText: signalText
  };
}

// ======== UPDATE STAT BAR ========
function updateStatBar(){
  const total = totalWin + totalLose;
  const wr = total === 0 ? "-" : Math.round(totalWin / total * 100) + "%";
  document.getElementById("sWinRate").innerText = wr;
  document.getElementById("sTotal").innerText = totalWin + "W/" + totalLose + "L";

  // Streak dari DOM
  const streakCard = document.getElementById("sStreakCard");
  const streakEl = document.getElementById("sStreak");
  const doneRows = Array.from(document.querySelectorAll("#dataBody tr[data-done='1']"));
  if(doneRows.length > 0){
    const statuses = doneRows.map(tr => tr.querySelector(".status").innerText);
    let streak = 1;
    const cur = statuses[0];
    for(let i = 1; i < statuses.length; i++){
      if(statuses[i] === cur) streak++;
      else break;
    }
    streakEl.innerText = streak + "x " + cur;
    streakCard.className = "stat-card " + (cur === "WIN" ? "streak-win" : "streak-lose");
  }

  // Analisis Prediksi
  const pred = analisisPrediksi();
  document.getElementById("sPola").innerText = pred.pola;
  document.getElementById("sConf").innerText = pred.confidence + "%";

  const signalCard = document.getElementById("sSignalCard");
  signalCard.querySelector(".value").innerText = pred.signalText;
  signalCard.className = "stat-card signal " + pred.signal.toLowerCase();

  const suggestCard = document.getElementById("sSuggestCard");
  document.getElementById("sSuggest").innerText = pred.tebakan;
  suggestCard.className = "stat-card suggest " + pred.tebakan.toLowerCase();
}

// ======== UPDATE TREND DOTS ========
function updateTrendDots(){
  const bar = document.getElementById("trendBar");
  bar.querySelectorAll(".dot").forEach(d => d.remove());

  const slice = hasilHistory.slice(0, 20).reverse();
  slice.forEach(h => {
    const dot = document.createElement("div");
    dot.className = "dot " + (h.kategori === "Besar" ? "besar" : "kecil");
    dot.title = h.issue + ": " + h.kategori + " (" + h.angka + ")";
    bar.appendChild(dot);
  });

  if(currentRow && currentRow.dataset.done === "0"){
    const dot = document.createElement("div");
    dot.className = "dot pending";
    dot.title = currentRow.dataset.periode + ": Sedang berjalan...";
    bar.appendChild(dot);
  }
}

async function ambilAPI(){
  try{
    const res = await fetch("/api?t=" + Date.now());
    if(!res.ok) return null;
    return await res.json();
  }catch(e){
    console.log("API ERROR:", e);
    return null;
  }
}

// Sinkronisasi riwayat resmi
function sinkronkanHistory(list){
  if(!Array.isArray(list) || list.length === 0) return;
  list.forEach(e => {
    const issue = String(e.issueNumber).slice(-5);
    const num = typeof e.hasil === "number" ? e.hasil : parseInt(String(e.number).split(",").pop(), 10);
    const kat = kategori(num);
    const existing = hasilHistory.find(h => h.issue === issue);
    if(!existing){
      hasilHistory.push({ issue, kategori: kat, angka: num });
    }
  });
  hasilHistory.sort((a, b) => parseInt(b.issue, 10) - parseInt(a.issue, 10));
  if(hasilHistory.length > 50) hasilHistory = hasilHistory.slice(0, 50);
}

// Tambah baris baru di tabel
function tambahBaris(periode){
  const tbody = document.getElementById("dataBody");
  const p = String(periode);

  // Hapus baris loading jika ada
  const loading = document.getElementById("loadingRow");
  if(loading) loading.remove();

  if(tbody.firstChild && tbody.firstChild.dataset && tbody.firstChild.dataset.periode === p) return;

  const pred = analisisPrediksi();
  const predClass = pred.tebakan === "Besar" ? "pred-besar" : "pred-kecil";
  const confClass = pred.confidence >= 75 ? "high" : (pred.confidence >= 65 ? "med" : "low");

  const tr = document.createElement("tr");
  tr.dataset.periode = p;
  tr.dataset.done = "0";
  tr.dataset.prediksi = pred.tebakan;
  tr.dataset.confidence = pred.confidence;
  tr.innerHTML = `
    <td>${p}</td>
    <td class="${predClass}">${pred.tebakan}</td>
    <td><span class="badge-conf ${confClass}">${pred.confidence}%</span></td>
    <td class="count">-</td>
    <td class="hasil">-</td>
    <td class="status">-</td>
  `;
  tbody.insertBefore(tr, tbody.firstChild);
  while(tbody.children.length > 35) tbody.removeChild(tbody.lastChild);
  currentRow = tr;

  updateTrendDots();
  updateStatBar();
}

// Re-evaluasi saat hasil N-1 keluar resmi dari API
function perbaruiPrediksiAktif(){
  if(!currentRow || currentRow.dataset.done === "1") return;
  const pred = analisisPrediksi();
  const predCell = currentRow.children[1];
  const confCell = currentRow.children[2];

  predCell.innerText = pred.tebakan;
  predCell.className = pred.tebakan === "Besar" ? "pred-besar" : "pred-kecil";
  currentRow.dataset.prediksi = pred.tebakan;
  currentRow.dataset.confidence = pred.confidence;

  const confClass = pred.confidence >= 75 ? "high" : (pred.confidence >= 65 ? "med" : "low");
  confCell.innerHTML = `<span class="badge-conf ${confClass}">${pred.confidence}%</span>`;

  updateStatBar();
}

function isiHasil(tr, hasil){
  if(!tr || tr.dataset.done === "1") return;
  tr.dataset.done = "1";
  const kat = kategori(hasil);
  tr.querySelector(".hasil").innerText = kat + " " + hasil;
  const statusCell = tr.querySelector(".status");
  const prediksi = tr.dataset.prediksi || tr.children[1].innerText;

  if(prediksi === kat){
    statusCell.innerText = "WIN";
    statusCell.className = "status win";
    totalWin++;
  } else {
    statusCell.innerText = "LOSE";
    statusCell.className = "status lose";
    totalLose++;
  }

  const issue = tr.dataset.periode;
  if(!hasilHistory.some(h => h.issue === issue)){
    hasilHistory.unshift({ issue, kategori: kat, angka: hasil });
  }

  updateStatBar();
  updateTrendDots();
  perbaruiPrediksiAktif();
}

// Cocokkan hasil dari API ke baris tabel
function cocokkanHasil(list){
  if(!Array.isArray(list)) return;
  sinkronkanHistory(list);

  document.querySelectorAll("#dataBody tr").forEach(tr => {
    if(tr.dataset.done === "1") return;
    const found = list.find(e => String(e.issueNumber).slice(-5) === tr.dataset.periode);
    if(found) isiHasil(tr, found.hasil);
  });

  perbaruiPrediksiAktif();
}

async function cekData(){
  const data = await ambilAPI();
  if(!data || data.error) return;
  cocokkanHasil(data.list);

  const apiP = parseInt(data.periode, 10);
  if(!isNaN(apiP)){
    // Perbaikan deadlock: Jika lastPeriode null atau lebih baru, langsung buat baris!
    if(lastPeriode === null || apiP > lastPeriode){
      lastPeriode = apiP;
      tambahBaris(apiP);
    }
  }
}

function mulaiCountdown(){
  if(timer) clearInterval(timer);
  timer = setInterval(() => {
    const now = new Date();
    const sec = now.getSeconds();
    const sisa = 30 - (sec % 30);

    // Pergantian periode sinkron 30 detik
    if(lastSisa !== null && lastSisa <= 3 && sisa === 30 && lastPeriode !== null){
      if(currentRow && currentRow.dataset.done === "0"){
        currentRow.querySelector(".count").innerText = "Undian...";
      }
      lastPeriode++;
      tambahBaris(lastPeriode);
    }
    lastSisa = sisa;

    if(currentRow){
      currentRow.querySelector(".count").innerText = sisa;
    }

    if(sec % 2 === 0) cekData();
  }, 1000);
}

// Inisialisasi mandiri (Tidak akan membeku jika API delay)
async function start(){
  // 1. Selalu jalankan countdown timer terlebih dahulu
  mulaiCountdown();

  // 2. Ambil data API perdana
  await cekData();
  updateStatBar();
  updateTrendDots();
}

start();

</script>

</body>
</html>
