<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>WEB 55 PANEL</title>

<style>
* { box-sizing: border-box; }

body{
  margin:0;
  background:#0b0c10;
  color:#e0e6ed;
  font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  height:100vh;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

/* ======== STAT BAR (RESPONSIVE GRID) ======== */
.stat-bar{
  display:grid;
  grid-template-columns: repeat(4, 1fr);
  gap:4px;
  padding:5px 6px;
  background:#12141c;
  border-bottom:1px solid #1f2433;
  flex-shrink:0;
}

.stat-card{
  background:#1a1d29;
  border:1px solid #282f42;
  border-radius:6px;
  padding:4px 6px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
}

.stat-card .label{
  color:#8a94a6;
  font-size:9px;
  text-transform:uppercase;
  letter-spacing:0.3px;
  margin-bottom:1px;
}

.stat-card .value{
  font-weight:bold;
  font-size:12px;
}

.stat-card.win-rate .value { color:#00e676; }
.stat-card.streak-win .value { color:#ffeb3b; }
.stat-card.streak-lose .value { color:#ff5252; }
.stat-card.total .value { color:#80d8ff; }
.stat-card.pola .value { color:#ce93d8; font-size:11px; }
.stat-card.conf .value { color:#ffd54f; }

.stat-card.signal {
  grid-column: span 2;
  font-weight:bold;
}
.stat-card.signal.strong { border-color:#00e676; background:#0b2918; color:#00e676; }
.stat-card.signal.medium { border-color:#ffb300; background:#291e05; color:#ffb300; }
.stat-card.signal.wait { border-color:#ff5252; background:#290d0d; color:#ff8a80; }

.stat-card.suggest {
  grid-column: span 2;
}
.stat-card.suggest.besar { border-color:#2979ff; background:#0d1f42; color:#82b1ff; }
.stat-card.suggest.kecil { border-color:#ff1744; background:#380e15; color:#ff8a80; }

/* ======== TREND DOTS ======== */
.trend-bar{
  padding:3px 8px;
  background:#0e1017;
  display:flex;
  align-items:center;
  gap:4px;
  overflow-x:auto;
  border-bottom:1px solid #1a1e2b;
  min-height:24px;
  flex-shrink:0;
}

.trend-bar .tlabel{
  font-size:10px;
  color:#5a6578;
  margin-right:2px;
  flex-shrink:0;
  font-weight:700;
}

.dot{
  width:12px;
  height:12px;
  border-radius:50%;
  flex-shrink:0;
}
.dot.besar{ background:#2979ff; box-shadow:0 0 4px rgba(41,121,255,0.7); }
.dot.kecil{ background:#ff1744; box-shadow:0 0 4px rgba(255,23,68,0.7); }
.dot.pending{ background:#2e3547; animation:pulse 1.2s infinite; }

@keyframes pulse {
  0%, 100% { opacity: 0.4; }
  50% { opacity: 1; }
}

/* ======== PANEL TABEL ======== */
.panel{
  flex:0 0 auto;
  height:28vh;
  min-height:160px;
  max-height:35vh;
  background:#12141c;
  overflow-y:auto;
  padding:0;
  -webkit-overflow-scrolling:touch;
}

.web55{
  flex:1 1 auto;
  min-height:0;
  height:100%;
}

iframe{
  width:100%;
  height:100%;
  border:none;
}

table{
  width:100%;
  border-collapse:collapse;
  font-size:11px;
}

th,td{
  border:1px solid #1f2433;
  padding:4px 3px;
  text-align:center;
}

th{
  background:#171a24;
  color:#8a94a6;
  font-size:10px;
  position:sticky;
  top:0;
  z-index:2;
  letter-spacing:0.3px;
}

tr:hover td { background:#181c28; }

.win{ color:#00e676; font-weight:bold; }
.lose{ color:#ff5252; font-weight:bold; }
td.pred-besar { color:#82b1ff; font-weight:bold; }
td.pred-kecil { color:#ff8a80; font-weight:bold; }
td.pred-tunggu { color:#ffb300; font-weight:bold; font-size:10px; letter-spacing:0.3px; }

.badge-level{
  font-size:10px;
  font-weight:bold;
  padding:2px 5px;
  border-radius:4px;
  display:inline-block;
}
.badge-level.lvl-1{ background:#0b2918; color:#00e676; border:1px solid #00e676; }
.badge-level.lvl-2{ background:#291e05; color:#ffb300; border:1px solid #ffb300; }
.badge-level.lvl-3{ background:#290d0d; color:#ff5252; border:1px solid #ff5252; }

.stat-card.level-card .value{ font-size:11px; }
.stat-card.level-card.lvl-1 .value{ color:#00e676; }
.stat-card.level-card.lvl-2 .value{ color:#ffb300; }
.stat-card.level-card.lvl-3 .value{ color:#ff5252; }

.loading-cell{
  padding:16px;
  color:#8a94a6;
  font-size:12px;
}
</style>
</head>

<body>

<!-- STAT BAR -->
<div class="stat-bar">
  <div class="stat-card win-rate">
    <span class="label">📊 Win Rate</span>
    <span class="value" id="sWinRate">-</span>
  </div>
  <div class="stat-card total">
    <span class="label">🎯 W/L</span>
    <span class="value" id="sTotal">0W/0L</span>
  </div>
  <div class="stat-card" id="sStreakCard">
    <span class="label">🔥 Streak</span>
    <span class="value" id="sStreak">-</span>
  </div>
  <div class="stat-card level-card lvl-1" id="sLevelCard">
    <span class="label">⚡ Level Sinyal</span>
    <span class="value" id="sLevel">L1 (Normal)</span>
  </div>

  <div class="stat-card pola" style="grid-column:span 2;">
    <span class="label">📈 Pola Papan Tren</span>
    <span class="value" id="sPola">Menganalisis...</span>
  </div>
  <div class="stat-card suggest" id="sSuggestCard" style="grid-column:span 2;">
    <span class="label">🤖 Saran Prediksi VIP</span>
    <span class="value" id="sSuggest">-</span>
  </div>
</div>

<!-- TREND DOTS -->
<div class="trend-bar" id="trendBar">
  <span class="tlabel">TREN:</span>
</div>

<!-- TABLE PANEL -->
<div class="panel">
  <table>
    <thead>
      <tr>
        <th style="width:20%;">Periode</th>
        <th style="width:20%;">Prediksi</th>
        <th style="width:14%;">Level</th>
        <th style="width:14%;">Sisa</th>
        <th style="width:18%;">Hasil</th>
        <th style="width:14%;">Status</th>
      </tr>
    </thead>
    <tbody id="dataBody">
      <tr id="loadingRow">
        <td colspan="6" class="loading-cell">⏳ Menghubungkan ke live data 55five...</td>
      </tr>
    </tbody>
  </table>
</div>

<div class="web55">
  <iframe src="https://55x4mqd.com/#/home/"></iframe>
</div>

<script>

let currentRow = null;
let timer = null;
let lastPeriode = null;
let lastSisa = null;

// Riwayat resmi: [{ issue: "52864", kategori: "Besar", angka: 9 }]
let hasilHistory = [];
let totalWin = 0;
let totalLose = 0;

// Sistem Level Martingale VIP (L1, L2, L3)
let currentMartingaleLevel = 1;
// Prediksi terakhir yang dipasang (untuk Same-Side Martingale)
let lastPrediksi = null;
// Circuit Breaker: hitung lose streak & cooldown
let loseStreakCount = 0;
let waitRonde = 0; // jumlah ronde yang harus di-skip

function kategori(num){
  return num <= 4 ? "Kecil" : "Besar";
}

// ======== ENGINE ADAPTIVE ROAD v3 (DOMINANCE FILTER + CIRCUIT BREAKER) ========

// Deteksi dominasi satu sisi: jika >= 7 dari 10 ronde = satu sisi, ikuti sisi itu
function deteksiDominasi(cats){
  if(cats.length < 8) return null;
  const w = cats.slice(0, 10);
  const jumlahBesar = w.filter(c => c === "Besar").length;
  const jumlahKecil = w.length - jumlahBesar;
  if(jumlahBesar >= 7) return "Besar";
  if(jumlahKecil >= 7) return "Kecil";
  return null;
}

// Deteksi rezim pasar: "naga" = dominan pasangan/tren, "chop" = ping-pong dominan
function deteksiRezim(cats){
  if(cats.length < 6) return "naga";
  const w = cats.slice(0, Math.min(cats.length, 10));
  let switches = 0;
  for(let i = 1; i < w.length; i++){
    if(w[i] !== w[i-1]) switches++;
  }
  // > 55% pergantian = chop (diturunkan dari 60% agar lebih sensitif)
  const rasio = switches / (w.length - 1);
  return rasio > 0.55 ? "chop" : "naga";
}

function analisisPrediksi(){
  // === CIRCUIT BREAKER: Mode TUNGGU ===
  if(waitRonde > 0){
    return {
      tebakan: null, // null = skip/tunggu
      pola: "⏸️ TUNGGU " + waitRonde + " ronde lagi (recovery)",
      level: currentMartingaleLevel,
      signalText: "⏸️ TUNGGU — jangan pasang"
    };
  }

  if(hasilHistory.length < 2){
    return {
      tebakan: "Besar",
      pola: "Memuat Data...",
      level: currentMartingaleLevel,
      signalText: "L" + currentMartingaleLevel + " (NORMAL)"
    };
  }

  const cats = hasilHistory.map(h => h.kategori);

  // === DOMINANCE FILTER (prioritas tertinggi) ===
  // Jika satu sisi mendominasi 7+/10 ronde terakhir, ikuti sisi itu
  const dominasi = deteksiDominasi(cats);
  if(dominasi){
    return {
      tebakan: dominasi,
      pola: "⚠️ Dominasi " + dominasi + " — ikuti arus pasar",
      level: currentMartingaleLevel,
      signalText: "L" + currentMartingaleLevel + " • DOMINASI " + dominasi
    };
  }

  const rezim = deteksiRezim(cats);

  // === STREAK ENGINE ===
  let streak = 1;
  for(let i = 1; i < cats.length; i++){
    if(cats[i] === cats[0]) streak++;
    else break;
  }

  // === PING-PONG ENGINE ===
  let altSteps = 1;
  for(let i = 1; i < Math.min(cats.length, 8); i++){
    if(cats[i] !== cats[i-1]) altSteps++;
    else break;
  }

  // ======================
  // REZIM NAGA/TREN
  // ======================
  if(rezim === "naga"){
    // NAGA >= 2: Ikuti arus
    if(streak >= 2){
      return {
        tebakan: cats[0],
        pola: "🔥 Naga " + cats[0] + " (" + streak + "x) | Tren",
        level: currentMartingaleLevel,
        signalText: "L" + currentMartingaleLevel + " • NAGA " + streak + "x"
      };
    }
    // L2/L3: pertahankan sisi — dalam rezim tren, cenderung pasangan
    if(currentMartingaleLevel >= 2 && lastPrediksi){
      return {
        tebakan: lastPrediksi,
        pola: "🛡️ Kompensasi " + lastPrediksi + " | Tren",
        level: currentMartingaleLevel,
        signalText: "L" + currentMartingaleLevel + " • STAY " + lastPrediksi
      };
    }
    // Switch baru 1x: Ikuti sisi baru (pasangan)
    return {
      tebakan: cats[0],
      pola: "👥 Pasangan Baru (" + cats[0] + ") | Tren",
      level: currentMartingaleLevel,
      signalText: "L" + currentMartingaleLevel + " • IKUTI PASANGAN"
    };
  }

  // ======================
  // REZIM CHOP (PING-PONG)
  // ======================
  if(rezim === "chop"){
    // Ping-pong terkonfirmasi >= 3: Lanjutkan ayunan
    if(altSteps >= 3){
      const nextAlt = cats[0] === "Besar" ? "Kecil" : "Besar";
      return {
        tebakan: nextAlt,
        pola: "⚡ Ping-Pong (" + altSteps + "x) | Chop",
        level: currentMartingaleLevel,
        signalText: "L" + currentMartingaleLevel + " • PING-PONG"
      };
    }
    // Chop tapi ada naga >= 2
    if(streak >= 2){
      return {
        tebakan: cats[0],
        pola: "🔥 Naga Sementara (" + streak + "x) | Chop",
        level: currentMartingaleLevel,
        signalText: "L" + currentMartingaleLevel + " • NAGA CHOP"
      };
    }
    // L2/L3: balik sisi (chop market berbalik)
    if(currentMartingaleLevel >= 2 && lastPrediksi){
      const kompensasi = lastPrediksi === "Besar" ? "Kecil" : "Besar";
      return {
        tebakan: kompensasi,
        pola: "🔄 Kompensasi Chop (" + kompensasi + ") | Chop",
        level: currentMartingaleLevel,
        signalText: "L" + currentMartingaleLevel + " • BALIK " + kompensasi
      };
    }
    // Default chop: Ikuti kebalikan
    const opposite = cats[0] === "Besar" ? "Kecil" : "Besar";
    return {
      tebakan: opposite,
      pola: "↔️ Ayun Chop (" + opposite + ") | Chop",
      level: currentMartingaleLevel,
      signalText: "L" + currentMartingaleLevel + " • AYUN"
    };
  }

  // Fallback
  return {
    tebakan: cats[0],
    pola: "👥 Pasangan Baru (" + cats[0] + ")",
    level: currentMartingaleLevel,
    signalText: "L" + currentMartingaleLevel + " • IKUTI PASANGAN"
  };
}

// ======== UPDATE STAT BAR ========
function updateStatBar(){
  const total = totalWin + totalLose;
  const wr = total === 0 ? "-" : Math.round(totalWin / total * 100) + "%";
  document.getElementById("sWinRate").innerText = wr;
  document.getElementById("sTotal").innerText = totalWin + "W/" + totalLose + "L";

  // Streak dari DOM
  const streakCard = document.getElementById("sStreakCard");
  const streakEl = document.getElementById("sStreak");
  const doneRows = Array.from(document.querySelectorAll("#dataBody tr[data-done='1']"));
  if(doneRows.length > 0){
    const statuses = doneRows.map(tr => tr.querySelector(".status").innerText);
    let streak = 1;
    const cur = statuses[0];
    for(let i = 1; i < statuses.length; i++){
      if(statuses[i] === cur) streak++;
      else break;
    }
    streakEl.innerText = streak + "x " + cur;
    streakCard.className = "stat-card " + (cur === "WIN" ? "streak-win" : "streak-lose");
  }

  // Analisis Prediksi
  const pred = analisisPrediksi();
  document.getElementById("sPola").innerText = pred.pola;

  // Level Card
  const lvlCard = document.getElementById("sLevelCard");
  const lvlText = pred.level === 1 ? "L1 (Normal)" : (pred.level === 2 ? "L2 (Kompensasi 3x)" : "L3 (Kompensasi 8x)");
  document.getElementById("sLevel").innerText = lvlText;
  lvlCard.className = "stat-card level-card lvl-" + pred.level;

  // Saran Card
  const suggestCard = document.getElementById("sSuggestCard");
  document.getElementById("sSuggest").innerText = pred.tebakan + " [L" + pred.level + "]";
  suggestCard.className = "stat-card suggest " + pred.tebakan.toLowerCase();
}

// ======== UPDATE TREND DOTS ========
function updateTrendDots(){
  const bar = document.getElementById("trendBar");
  bar.querySelectorAll(".dot").forEach(d => d.remove());

  const slice = hasilHistory.slice(0, 20).reverse();
  slice.forEach(h => {
    const dot = document.createElement("div");
    dot.className = "dot " + (h.kategori === "Besar" ? "besar" : "kecil");
    dot.title = h.issue + ": " + h.kategori + " (" + h.angka + ")";
    bar.appendChild(dot);
  });

  if(currentRow && currentRow.dataset.done === "0"){
    const dot = document.createElement("div");
    dot.className = "dot pending";
    dot.title = currentRow.dataset.periode + ": Sedang berjalan...";
    bar.appendChild(dot);
  }
}

async function ambilAPI(){
  try{
    const res = await fetch("/api?t=" + Date.now());
    if(!res.ok) return null;
    return await res.json();
  }catch(e){
    console.log("API ERROR:", e);
    return null;
  }
}

// Sinkronisasi riwayat resmi
function sinkronkanHistory(list){
  if(!Array.isArray(list) || list.length === 0) return;
  list.forEach(e => {
    const issue = String(e.issueNumber).slice(-5);
    const num = typeof e.hasil === "number" ? e.hasil : parseInt(String(e.number).split(",").pop(), 10);
    const kat = kategori(num);
    const existing = hasilHistory.find(h => h.issue === issue);
    if(!existing){
      hasilHistory.push({ issue, kategori: kat, angka: num });
    }
  });
  hasilHistory.sort((a, b) => parseInt(b.issue, 10) - parseInt(a.issue, 10));
  if(hasilHistory.length > 50) hasilHistory = hasilHistory.slice(0, 50);
}

// Tambah baris baru di tabel
function tambahBaris(periode){
  const tbody = document.getElementById("dataBody");
  const p = String(periode);

  // Hapus baris loading jika ada
  const loading = document.getElementById("loadingRow");
  if(loading) loading.remove();

  if(tbody.firstChild && tbody.firstChild.dataset && tbody.firstChild.dataset.periode === p) return;

  const pred = analisisPrediksi();
  // Handle mode TUNGGU (tebakan = null)
  const isTunggu = pred.tebakan === null;
  const predClass = isTunggu ? "pred-tunggu" : (pred.tebakan === "Besar" ? "pred-besar" : "pred-kecil");
  const predLabel = isTunggu ? "⏸️ TUNGGU" : pred.tebakan;
  const levelLabel = isTunggu ? "—" : `<span class="badge-level lvl-${pred.level}">L${pred.level}</span>`;
  const tr = document.createElement("tr");
  tr.dataset.periode = p;
  tr.dataset.done = "0";
  tr.dataset.prediksi = isTunggu ? "TUNGGU" : pred.tebakan;
  tr.dataset.level = pred.level;
  tr.innerHTML = `
    <td>${p}</td>
    <td class="${predClass}">${predLabel}</td>
    <td>${levelLabel}</td>
    <td class="count">-</td>
    <td class="hasil">-</td>
    <td class="status">-</td>
  `;
  tbody.insertBefore(tr, tbody.firstChild);
  while(tbody.children.length > 35) tbody.removeChild(tbody.lastChild);
  currentRow = tr;

  // Kurangi waitRonde setiap kali baris baru dibuat (satu ronde berlalu)
  if(waitRonde > 0) waitRonde--;

  updateTrendDots();
  updateStatBar();
}

// Re-evaluasi saat hasil N-1 keluar resmi dari API
function perbaruiPrediksiAktif(){
  if(!currentRow || currentRow.dataset.done === "1") return;
  const pred = analisisPrediksi();
  const predCell = currentRow.children[1];
  const levelCell = currentRow.children[2];
  const isTunggu = pred.tebakan === null;

  predCell.innerText = isTunggu ? "⏸️ TUNGGU" : pred.tebakan;
  predCell.className = isTunggu ? "pred-tunggu" : (pred.tebakan === "Besar" ? "pred-besar" : "pred-kecil");
  currentRow.dataset.prediksi = isTunggu ? "TUNGGU" : pred.tebakan;
  currentRow.dataset.level = pred.level;

  levelCell.innerHTML = isTunggu ? "—" : `<span class="badge-level lvl-${pred.level}">L${pred.level}</span>`;

  updateStatBar();
}

function isiHasil(tr, hasil){
  if(!tr || tr.dataset.done === "1") return;
  tr.dataset.done = "1";
  const kat = kategori(hasil);
  tr.querySelector(".hasil").innerText = kat + " " + hasil;
  const statusCell = tr.querySelector(".status");
  const prediksi = tr.dataset.prediksi || tr.children[1].innerText;

  // Simpan prediksi terakhir untuk Same-Side Martingale
  lastPrediksi = prediksi;

  if(prediksi === "TUNGGU"){
    // Skip ronde, tidak dihitung W/L
    statusCell.innerText = "SKIP";
    statusCell.className = "status";
    if(waitRonde > 0) waitRonde--;
    return;
  }

  if(prediksi === kat){
    statusCell.innerText = "WIN";
    statusCell.className = "status win";
    totalWin++;
    currentMartingaleLevel = 1;
    lastPrediksi = null;
    loseStreakCount = 0; // Reset lose streak saat WIN
    waitRonde = 0;
  } else {
    statusCell.innerText = "LOSE";
    statusCell.className = "status lose";
    totalLose++;
    currentMartingaleLevel = currentMartingaleLevel >= 3 ? 1 : currentMartingaleLevel + 1;
    loseStreakCount++;
    // CIRCUIT BREAKER: 3 lose berturut → tunggu 3 ronde
    if(loseStreakCount >= 3){
      waitRonde = 3;
      loseStreakCount = 0;
      lastPrediksi = null;
      currentMartingaleLevel = 1; // Reset ke L1 saat masuk cooldown
    }
  }

  const issue = tr.dataset.periode;
  if(!hasilHistory.some(h => h.issue === issue)){
    hasilHistory.unshift({ issue, kategori: kat, angka: hasil });
  }

  updateStatBar();
  updateTrendDots();
  perbaruiPrediksiAktif();
}

// Cocokkan hasil dari API ke baris tabel
function cocokkanHasil(list){
  if(!Array.isArray(list)) return;
  sinkronkanHistory(list);

  document.querySelectorAll("#dataBody tr").forEach(tr => {
    if(tr.dataset.done === "1") return;
    const found = list.find(e => String(e.issueNumber).slice(-5) === tr.dataset.periode);
    if(found) isiHasil(tr, found.hasil);
  });

  perbaruiPrediksiAktif();
}

async function cekData(){
  const data = await ambilAPI();
  if(!data || data.error) return;
  cocokkanHasil(data.list);

  const apiP = parseInt(data.periode, 10);
  if(!isNaN(apiP)){
    // Perbaikan deadlock: Jika lastPeriode null atau lebih baru, langsung buat baris!
    if(lastPeriode === null || apiP > lastPeriode){
      lastPeriode = apiP;
      tambahBaris(apiP);
    }
  }
}

function mulaiCountdown(){
  if(timer) clearInterval(timer);
  timer = setInterval(() => {
    const now = new Date();
    const sec = now.getSeconds();
    const sisa = 30 - (sec % 30);

    // Pergantian periode sinkron 30 detik
    if(lastSisa !== null && lastSisa <= 3 && sisa === 30 && lastPeriode !== null){
      if(currentRow && currentRow.dataset.done === "0"){
        currentRow.querySelector(".count").innerText = "Undian...";
      }
      lastPeriode++;
      tambahBaris(lastPeriode);
    }
    lastSisa = sisa;

    if(currentRow){
      currentRow.querySelector(".count").innerText = sisa;
    }

    if(sec % 2 === 0) cekData();
  }, 1000);
}

// Inisialisasi mandiri (Tidak akan membeku jika API delay)
async function start(){
  // 1. Selalu jalankan countdown timer terlebih dahulu
  mulaiCountdown();

  // 2. Ambil data API perdana
  await cekData();
  updateStatBar();
  updateTrendDots();
}

start();

</script>

</body>
</html>
